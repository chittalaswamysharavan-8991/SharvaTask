name: Apply isolated routing intent fix

on:
  push:
    branches:
      - fix/mcp-routing-intent-20260806
    paths:
      - .github/workflows/routing-fix-apply.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mcp-routing-intent-20260806
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Decode routing patch
        env:
          PATCH_B64: >-
            
        run: |
          python - <<'PY'
          import base64, gzip, os
          payload = ''.join(os.environ['PATCH_B64'].split())
          open('/tmp/apply-routing-fix.py', 'wb').write(gzip.decompress(base64.b64decode(payload)))
          PY

      - name: Apply phases 1-4
        run: python /tmp/apply-routing-fix.py

      - name: Install dependencies
        run: npm ci

      - name: Verify routing fix
        run: npm run verify

      - name: Commit verified branch changes
        run: |
          rm .github/workflows/routing-fix-apply.yml
          git config user.name "Pablo Routing QA"
          git config user.email "pablo-routing-qa@users.noreply.github.com"
          git add -A
          git commit -m "Fix MCP route intent preservation across widget modes"
          git push origin HEAD:fix/mcp-routing-intent-20260806

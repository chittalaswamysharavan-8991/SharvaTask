name: Control center hydration fix

on:
  push:
    branches: [feature/web-control-center-20260806]
    paths:
      - .github/workflows/control-center-hydration-fix.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/web-control-center-20260806
          fetch-depth: 0

      - name: Apply deterministic date rendering and precise QA selectors
        run: echo '' | base64 -d | python

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify

      - name: Commit verified fix
        run: |
          git config user.name "SharvaTask QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/control-center.tsx scripts/control-center-preview-qa.mjs
          git commit -m "Fix deterministic control center hydration"
          git push origin HEAD:feature/web-control-center-20260806

name: Apply Search Board Contract Fix
on:
  push:
    branches: [fix/search-board-contract-20260807]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/search-board-contract-20260807
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply narrow source patch
        run: node scripts/apply-search-board-contract-fix.mjs
      - name: Commit patch if needed
        run: |
          git config user.name "SharvaTask Release Audit"
          git config user.email "actions@users.noreply.github.com"
          git add src/domain/sharvaTaskService.ts
          if git diff --cached --quiet; then
            echo "No patch changes required."
          else
            git commit -m "fix: return task results from search_board"
            git push origin HEAD:fix/search-board-contract-20260807
          fi

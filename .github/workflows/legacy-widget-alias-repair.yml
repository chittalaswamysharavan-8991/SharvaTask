name: Legacy widget URI repair

on:
  push:
    branches: [fix/legacy-widget-uri-alias-20260806]
    paths:
      - .github/workflows/legacy-widget-alias-repair.yml

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/legacy-widget-uri-alias-20260806
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Add backward-compatible widget resource alias
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          route_path = Path('app/api/mcp/route.ts')
          route = route_path.read_text()
          legacy_uri = "ui://widget/sharvatask-v2-4-clickdiag.html"

          if "'sharvatask_widget_legacy'" not in route:
              start = route.index("    server.registerResource(\n      'sharvatask_widget',\n      SHARVATASK_WIDGET_URI,")
              marker = "\n\n    server.registerTool("
              end = route.index(marker, start)
              block = route[start:end]
              legacy = block.replace("'sharvatask_widget'", "'sharvatask_widget_legacy'", 1)
              legacy = legacy.replace("SHARVATASK_WIDGET_URI,", f"'{legacy_uri}',", 1)
              route = route[:end] + "\n\n" + legacy + route[end:]
              route_path.write_text(route)

          verify_path = Path('scripts/verify-descriptor.mjs')
          verify = verify_path.read_text()
          assertion = "assert.match(route, /sharvatask_widget_legacy[\\s\\S]*ui:\\/\\/widget\\/sharvatask-v2-4-clickdiag\\.html/, 'legacy cached widget URI must remain readable');"
          if 'legacy cached widget URI must remain readable' not in verify:
              insert_at = verify.index("\nconsole.log(")
              verify = verify[:insert_at] + "\n" + assertion + verify[insert_at:]
              verify_path.write_text(verify)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run static and regression gates
        run: |
          npm run verify:descriptor
          npm run verify:phase-f
          npm run typecheck
          npm test
          npm run build

      - name: Verify both MCP widget resources through the protocol
        shell: bash
        run: |
          npm run start -- -p 4174 > /tmp/sharvatask-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4174/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4174/api/health
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { Client } from '@modelcontextprotocol/sdk/client/index.js';
          import { StreamableHTTPClientTransport } from '@modelcontextprotocol/sdk/client/streamableHttp.js';

          const endpoint = new URL('http://127.0.0.1:4174/api/mcp');
          const client = new Client({ name: 'sharvatask-resource-alias-qa', version: '1.0.0' });
          await client.connect(new StreamableHTTPClientTransport(endpoint));

          const current = 'ui://widget/sharvatask-v2-4-clean.html';
          const legacy = 'ui://widget/sharvatask-v2-4-clickdiag.html';
          const listed = await client.listResources();
          const uris = listed.resources.map(resource => resource.uri);
          assert.ok(uris.includes(current), `current widget URI missing: ${JSON.stringify(uris)}`);
          assert.ok(uris.includes(legacy), `legacy widget URI missing: ${JSON.stringify(uris)}`);

          for (const uri of [current, legacy]) {
            const result = await client.readResource({ uri });
            assert.equal(result.contents.length, 1);
            assert.equal(result.contents[0].uri, uri);
            assert.match(result.contents[0].mimeType || '', /text\/html/);
            assert.match(result.contents[0].text || '', /SharvaTask/);
          }

          const tools = await client.listTools();
          const open = tools.tools.find(tool => tool.name === 'open_task_board');
          assert.ok(open, 'open_task_board missing');
          assert.equal(open._meta?.['openai/outputTemplate'], current);

          const opened = await client.callTool({
            name: 'open_task_board',
            arguments: { initial_mode: 'board', restore_strategy: 'active_pointer' }
          });
          assert.ok(opened.structuredContent, 'open_task_board returned no structured content');
          await client.close();
          console.log(JSON.stringify({ verdict: 'PASS', resources: uris, outputTemplate: open._meta?.['openai/outputTemplate'] }, null, 2));
          NODE

      - name: Commit verified repair
        shell: bash
        run: |
          git config user.name "SharvaTask QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/api/mcp/route.ts scripts/verify-descriptor.mjs
          git commit -m "Fix: serve clean widget at legacy and current URIs"
          git push origin HEAD:fix/legacy-widget-uri-alias-20260806

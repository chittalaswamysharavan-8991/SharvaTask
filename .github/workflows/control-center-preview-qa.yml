name: Control center preview QA

on:
  push:
    branches: [feature/web-control-center-20260806]
    paths:
      - .github/workflows/control-center-preview-qa.yml
      - scripts/control-center-preview-qa.mjs

permissions:
  contents: read

env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright

jobs:
  browser-assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/web-control-center-20260806

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/control-center-preview-qa.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-center-preview-qa-${{ github.run_id }}
          path: control-center-preview-qa
          if-no-files-found: error
          retention-days: 14

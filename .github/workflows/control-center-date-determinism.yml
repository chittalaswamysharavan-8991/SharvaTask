name: Control center date determinism

on:
  push:
    branches: [feature/web-control-center-20260806]
    paths:
      - .github/workflows/control-center-date-determinism.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/web-control-center-20260806
          fetch-depth: 0

      - name: Replace Intl date output with deterministic IST formatting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/control-center.tsx')
          text = path.read_text()
          start = text.index('function formatDate(value?: string) {')
          end = text.index('\n\nfunction statusLabel', start)
          replacement = '''const IST_OFFSET_MS = 5.5 * 60 * 60 * 1000;
          const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
          const WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

          function istParts(value?: string) {
            if (!value) return null;
            const timestamp = Date.parse(value);
            if (!Number.isFinite(timestamp)) return null;
            const shifted = new Date(timestamp + IST_OFFSET_MS);
            return {
              weekday: WEEKDAYS[shifted.getUTCDay()],
              day: shifted.getUTCDate(),
              month: MONTHS[shifted.getUTCMonth()],
              hour24: shifted.getUTCHours(),
              minute: shifted.getUTCMinutes()
            };
          }

          function formatDate(value?: string) {
            const parts = istParts(value);
            if (!parts) return value || 'Not synced';
            const hour12 = parts.hour24 % 12 || 12;
            const minute = String(parts.minute).padStart(2, '0');
            const period = parts.hour24 >= 12 ? 'PM' : 'AM';
            return `${parts.day} ${parts.month}, ${hour12}:${minute} ${period}`;
          }

          function formatDayHeading(value?: string) {
            const parts = istParts(value);
            if (!parts) return 'Today';
            return `${parts.weekday}, ${parts.day} ${parts.month}`;
          }'''
          replacement = '\n'.join(line.strip() for line in replacement.splitlines())
          text = text[:start] + replacement + text[end:]

          old_heading = "{new Intl.DateTimeFormat('en-IN', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'Asia/Kolkata' }).format(new Date(state.server_time))}"
          if old_heading not in text:
            raise SystemExit('Topbar Intl heading not found')
          text = text.replace(old_heading, '{formatDayHeading(state.server_time)}')
          path.write_text(text)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "SharvaTask QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/control-center.tsx
          git commit -m "Eliminate control center date hydration drift"
          git push origin HEAD:feature/web-control-center-20260806

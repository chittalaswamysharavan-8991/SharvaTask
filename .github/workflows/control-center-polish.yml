name: Control center release polish

on:
  push:
    branches: [feature/web-control-center-20260806]
    paths:
      - .github/workflows/control-center-polish.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/web-control-center-20260806
          fetch-depth: 0

      - name: Add lock action and gate presentation
        shell: bash
        run: echo '' | base64 -d | python

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run verify

      - name: Commit verified polish
        shell: bash
        run: |
          git config user.name "SharvaTask QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/control-center.tsx app/globals.css
          git commit -m "Polish private control center access and lock flow"
          git push origin HEAD:feature/web-control-center-20260806
